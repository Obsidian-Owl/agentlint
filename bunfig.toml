# Bun configuration for agentlint
# https://bun.sh/docs/runtime/bunfig

[install]
# Use exact versions in lockfile
exact = true

[install.lockfile]
# Save lockfile in text format for better git diffs
print = "yarn"

[test]
# Test configuration
coverage = true
coverageDir = "coverage"

# CRITICAL: This preload blocks live tests unless RUN_LIVE_TESTS=1
# Prevents accidental API charges from running `bun test` without thinking
preload = ["./tests/preload.ts"]

[run]
# Silence the bun logo on startup
silent = true
