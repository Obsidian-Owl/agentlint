# SonarCloud Configuration for agentlint
sonar.projectKey=Obsidian-Owl_agentlint
sonar.organization=obsidian-owl

# Source and test directories
sonar.sources=src,apps
sonar.tests=tests,__tests__

# Exclusions for coverage (already built files)
sonar.exclusions=**/dist/**,**/node_modules/**,.omc/**

# =============================================================================
# Issue Exclusions - False Positives
# =============================================================================

# Multi-criteria issue ignore rules
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9

# E1: Hardcoded credentials in test files
# Test files for redaction.ts intentionally contain fake secrets to test redaction logic
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**/*

# E2: Weak PRNG (Math.random) in test files
# Test fixtures use Math.random for unique IDs - acceptable for test isolation
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e2.resourceKey=tests/**/*

# E3: Weak PRNG in __tests__ directory (different pattern)
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e3.resourceKey=__tests__/**/*

# E4: MD5 for non-security content hashing (conflict ID generation)
# hierarchy.ts uses MD5 to generate short IDs from file paths, not for security
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S4790
sonar.issue.ignore.multicriteria.e4.resourceKey=src/tools/config/hierarchy.ts

# E5: ReDoS patterns in quality-signals.ts - VERIFIED SAFE
# Manual audit confirmed: no nested quantifiers, no overlapping alternatives
# Patterns use simple word boundaries and non-nested optional groups
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S5852
sonar.issue.ignore.multicriteria.e5.resourceKey=src/sessions/extraction/quality-signals.ts

# E6: ReDoS patterns in redaction.ts - VERIFIED SAFE
# Manual audit confirmed: all patterns use specific prefixes for anchoring
# JWT pattern uses literal dots to separate segments, preventing backtracking
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S5852
sonar.issue.ignore.multicriteria.e6.resourceKey=src/debug/redaction.ts

# E7: HTTP URLs in test fixtures (not real network calls)
# Tests verify config parsing behavior, not actual network connections
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e7.resourceKey=tests/**/*

# E8: HTTP URLs in __tests__ fixtures
sonar.issue.ignore.multicriteria.e8.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e8.resourceKey=**/__tests__/**/*

# E9: PATH variable in CLI tool (expected behavior for git integration)
# CLI tools must inherit user's PATH to execute system commands like git
sonar.issue.ignore.multicriteria.e9.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.e9.resourceKey=src/cli/commands/conversation-manager.ts

# =============================================================================
# Analysis Parameters
# =============================================================================

# TypeScript settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
