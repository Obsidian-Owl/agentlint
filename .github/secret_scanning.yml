# GitHub Secret Scanning Configuration
# https://docs.github.com/en/code-security/secret-scanning/using-advanced-secret-scanning-and-push-protection-features/excluding-folders-and-files-from-secret-scanning
#
# This file excludes test directories from GitHub's secret scanning and push protection.
# These directories contain intentionally fake/example secrets used to test agentlint's
# secret detection capabilities.

paths-ignore:
  # Unit tests for secret detection - contain fake API keys for testing
  - "tests/unit/security/**"

  # Performance tests for redaction and secret detection
  - "tests/performance/**"

  # Test fixtures with example secrets
  - "tests/fixtures/**"
  - "tests/e2e/fixtures/**"

  # Integration tests that may contain example secrets
  - "tests/integration/secrets*.test.ts"

  # Config quality tests with anti-pattern examples
  - "tests/unit/tools/config/anti-patterns.test.ts"
  - "tests/unit/tools/config/quality.test.ts"

  # Redaction module contains example patterns for documentation
  - "src/debug/redaction.ts"

  # Gitleaks patterns file (contains regex patterns, not actual secrets)
  - "src/security/patterns/**"
